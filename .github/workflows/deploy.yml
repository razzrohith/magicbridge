name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# No blanket grant: the build job runs the whole dependency graph, so it gets
# read-only, and only the deploy job (which runs no third-party code) can publish.
permissions: {}

concurrency:
  group: pages
  # false, not true: cancelling mid-publish can abandon a deployment part-done.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave GITHUB_TOKEN sitting in .git/config for the rest of the job.
          persist-credentials: false
      # Third-party action, so pinned to a commit rather than a movable tag.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # next.config.ts sets output: "export", so this writes static files to out/
      - run: pnpm build
        env:
          # Repository variable, not a secret: NEXT_PUBLIC_* is compiled into
          # the client bundle, and a form endpoint has to be public anyway
          # because the visitor's browser is what posts to it. Storing it as a
          # secret would only hide it from the Actions log, not from the site.
          # Set it under Settings > Secrets and variables > Actions > Variables
          # and the reservation and support forms go live on the next deploy;
          # leave it unset and both pages keep saying so honestly.
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
      # Losing public/CNAME silently drops the custom domain on the next deploy,
      # so fail the build instead of publishing without it.
      - name: Verify custom domain file survived the build
        run: test -s out/CNAME && grep -qx 'magicbridge.razzrohith.com' out/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
